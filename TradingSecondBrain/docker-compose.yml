# Local-first stack for the Trading Second Brain.
#
# Default profile: n8n + qdrant + agents (FastAPI). Ollama runs natively on the
# host (recommended on Apple Silicon for GPU access). Set profile `with-ollama`
# to also run Ollama in a container (slower on Mac without Metal pass-through).

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: tsb-qdrant
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.65.0
    container_name: tsb-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/New_York}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-please-change-me}
      # Pass-through env so workflow nodes can read them
      - AGENT_API_HOST=host.docker.internal
      - AGENT_API_PORT=${API_PORT:-8088}
      - AGENT_API_TOKEN=${API_TOKEN:-changeme-local-token}
      - OBSIDIAN_API_URL=${OBSIDIAN_API_URL:-http://host.docker.internal:27124}
      - OBSIDIAN_API_KEY=${OBSIDIAN_API_KEY}
      - NTFY_TOPIC=${NTFY_TOPIC:-trading-second-brain-private}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: tsb-agents
    ports:
      - "${API_PORT:-8088}:8088"
    environment:
      - VAULT_PATH=/vault
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_REASONING_MODEL=${OLLAMA_REASONING_MODEL:-qwen3:32b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-trading_vault}
      - OBSIDIAN_API_URL=${OBSIDIAN_API_URL:-http://host.docker.internal:27124}
      - OBSIDIAN_API_KEY=${OBSIDIAN_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8088
      - API_TOKEN=${API_TOKEN:-changeme-local-token}
      - ALLOW_CLOUD_LLM=${ALLOW_CLOUD_LLM:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
    volumes:
      - ./obsidian-vault:/vault
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: run Ollama in a container. Skip on Mac unless you have CUDA elsewhere.
  ollama:
    image: ollama/ollama:0.3.12
    container_name: tsb-ollama
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_models:/root/.ollama
    restart: unless-stopped
